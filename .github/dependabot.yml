version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - react
          - react-dom
          - react-router-dom
          - "@types/react*"
      vite:
        patterns:
          - vite
          - "@vitejs/*"
      linting:
        patterns:
          - eslint
          - "@eslint/*"
          - eslint-plugin-*
          - globals

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
